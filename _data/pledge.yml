# Referendum pledge tool. One tool, one counter: /pledge-embed/ is the card,
# /pledge-counter/ the counter-only version, /pledge/ and /es/compromiso/ the
# site pages. The backend is the Google Apps Script in apps-script/pledge/.

# The Apps Script web app URL (ends in /exec). Empty = not connected yet:
# the counter stays hidden and the form shows its error message.
endpoint: "https://script.google.com/macros/s/AKfycbxvo-EN5uvfqpDpCD2ZsQPHNirG3Gj_ubHbfovB6_Wx_zJTY3_RxU4wq0WRxfUmyMRX/exec"
# Mailchimp: people who check "Send me campaign updates" are signed up from
# their browser through the same public signup form as the site's "Get
# updates" box (_includes/updates-dialog.html). No API key involved.
# tags: comma-separated Mailchimp tag IDs. 15370984 is the tag the "Get
# updates" form uses; add the IDs of "Pledge", "EN" and "ES" tags here once
# they exist in Mailchimp.
mailchimp:
  form: "https://forabrighterevanston.us9.list-manage.com/subscribe/post?u=a29ce2936bee1dac08509481b&id=891518ce66&f_id=008ceee3f0"
  honeypot: b_a29ce2936bee1dac08509481b_891518ce66
  tags: "15370984"
  tags_en: ""
  tags_es: ""
# Cloudflare Turnstile site key (public). Empty = no challenge widget.
# If you set it, also set TURNSTILE_SECRET in the Apps Script properties.
turnstile_sitekey: ""

