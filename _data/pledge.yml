  privacy_note: Your name and email are never shown publicly.      # (mockup)
  privacy_link: Privacy                                            # (mockup)
  why: Why this pledge, and why now?                               # (mockup)
  sending: Sending…
  share_label: Share the pledge
  copy_link: Copy link
  copied: Link copied
  text: Text message
  email_share: Email
  facebook: Facebook
  share_subject: Our kids deserve a better plan
  share_body: "I pledged to support a referendum for a better plan for D65. Will you pledge with me?"
  lang_label: Language
  page_url: /pledge/
  privacy_url: /privacy/

