  lead: "La votación del lunes sobre el plan de sostenibilidad financiera se aplazó. La Junta se reunirá el lunes 9 de noviembre a las 5 p. m. para continuar el debate. Se prevé una votación el 16 de noviembre."
  sig_label: ¡Firmas y seguimos sumando!
  sign_btn: Firmar la carta
  share_btn: Compartir la carta
  wtb:
    eyebrow: Haz escuchar tu voz
    title: Escribe a la Junta Escolar.
    text: Elige el tema que más te importa. Nosotros preparamos la carta y tú la envías desde tu correo. Toma unos dos minutos.
    cta: Haz clic aquí para escribir a la Junta
    comment: Cómo inscribirse para hacer un comentario público
  error:
    eyebrow: El error de 17 millones
    title: Los gastos de capital se contaron dos veces.
    text: "Miembros de la comunidad identificaron un error de 17 millones de dólares en las proyecciones financieras a cinco años del Distrito 65: los gastos de capital se habían contabilizado dos veces."
    sources_html: "Fuentes: <a href=\"https://evanstonroundtable.com/2026/10/25/district-65-financial-projections-error/\" target=\"_blank\" rel=\"noopener\">Evanston RoundTable</a> · <a href=\"https://patch.com/illinois/evanston/district-65-corrects-17m-projection-error-budget-cuts-still-advance\" target=\"_blank\" rel=\"noopener\">Patch</a> (el director financiero del D65 confirmó que se contaron dos veces las necesidades de capital)."
    why_title: Por qué importa una revisión independiente
    why_1: Esta corrección no elimina los desafíos financieros del distrito. Sin embargo, demuestra por qué es fundamental incorporar los conocimientos de la comunidad, cálculos transparentes y una revisión independiente antes de cerrar escuelas y recortar programas.
    why_2: Evanston y Skokie merecen un plan financieramente sostenible que proteja a los estudiantes, fortalezca las escuelas de nuestros vecindarios y se gane la confianza de la comunidad.
  asks:
    tag: Vota no a la propuesta actual
    title: "Exige una suspensión de los cierres de escuelas hasta que:"
    items:
      - title: Revisión independiente
        text: Las proyecciones financieras corregidas y las estimaciones de ahorro sean revisadas de manera independiente y explicadas públicamente.
      - title: Alternativas reales
        text: Se comparen alternativas viables, incluidas reducciones de gastos administrativos y otros gastos.
      - title: Impacto en los estudiantes
        text: Se evalúen y discutan las consecuencias para el aprendizaje, la educación bilingüe, la educación especial, el cuidado infantil y el acceso seguro a las escuelas.
      - title: Un plan compartido
        text: Las familias, los educadores, el distrito y los líderes municipales tengan una oportunidad real de participar en las decisiones.
  new_homes:
    tag: Nuevas viviendas, escuelas más lejos
    title: Se vienen 932 viviendas nuevas. El plan de cierres aleja la escuela de sus niños.
    text: Cinco desarrollos cerca de Dewey y Lincolnwood están aprobados, en aprobación o en construcción. Con los límites que propone el D65, a todos se les asigna una escuela más lejana, y el pronóstico del distrito no los cuenta.
    cta: Vea los cinco desarrollos
    svg_label: "Ilustración: edificios de viviendas nuevas, la escuela cercana marcada como cerrada y un niño que camina un trayecto más largo hasta una escuela más lejana, 1.2 millas en promedio."
