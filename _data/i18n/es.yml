home:
  title: "Votación de la Junta del D65 aplazada"
  description: "La votación del lunes sobre el plan de sostenibilidad financiera se aplazó. La Junta se reunirá el lunes 9 de noviembre a las 5 p. m. para continuar el debate. Se prevé una votación el 16 de noviembre."
