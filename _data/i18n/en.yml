home:
  title: "D65’s $17M error is now $27M. Vote no on Monday."
  description: "This plan would close Dewey and Lincolnwood, cut Head Start and eliminate more than 200 jobs. And it rests on numbers that keep changing. Tell the board to VOTE NO on Nov 9."
  share_image: "/assets/img/share-home-en-202a113c41.jpg"
  photo_credit: Photo by Joerg Metzner
  h1: D65’s $17M error is now $27M.
  h1_mark: Vote no on Monday.
  lead: "This plan would close Dewey and Lincolnwood, cut Head Start and eliminate more than 200 jobs. And it rests on numbers that keep changing. Tell the board to VOTE NO on Nov 9."
  sig_label: Signatures and counting!
  sign_btn: Sign the letter
  share_btn: Share the letter
  wtb:
    eyebrow: Add your voice
    title: Write to the School Board.
    text: Pick the issue that matters most to you. We draft the letter, you send it from your own email. It takes about two minutes.
    cta: Click here to write to the Board
    comment: How to sign up for public comment
  error:
    eyebrow: The $17 million error
    title: Capital spending was counted twice.
    text: "Community members identified a $17 million error in District 65’s five-year financial projections: capital spending had been counted twice."
    sources_html: "Sources: <a href=\"https://evanstonroundtable.com/2026/10/25/district-65-financial-projections-error/\" target=\"_blank\" rel=\"noopener\">Evanston RoundTable</a> · <a href=\"https://patch.com/illinois/evanston/district-65-corrects-17m-projection-error-budget-cuts-still-advance\" target=\"_blank\" rel=\"noopener\">Patch</a> (D65’s CFO confirmed capital needs were double-counted)."
    why_title: Why independent review matters
    why_1: That correction does not erase the district’s financial challenges. It does underscore why community expertise, transparent calculations, and independent review must be part of the process before schools close and programs are cut.
    why_2: Evanston and Skokie deserve a financially sustainable plan that protects students, strengthens neighborhood schools, and earns the community’s trust.
  asks:
    tag: Vote no on the current proposal
    title: "Put a moratorium on school closures until:"
    items:
      - title: Independent review
        text: Corrected financial projections and savings estimates are independently reviewed and publicly explained.
      - title: Real alternatives
        text: Credible alternatives—including administrative and other spending reductions—are compared.
      - title: Student impacts
        text: Student impacts on learning, bilingual education, special education, child care, and safe access to school are verified and discussed.
      - title: A shared plan
        text: Families, educators, the district, and city leaders have a meaningful opportunity to shape the path forward.
  new_homes:
    tag: New homes, farther schools
    title: 932 new homes are coming. The closure plan sends their kids farther away.
    text: Five developments near Dewey and Lincolnwood are approved, in approval or under construction. Under D65’s proposed boundaries, every one is assigned to a farther school, and the district’s forecast doesn’t count them.
    cta: See the five developments
    svg_label: "Illustration: new apartment buildings, the nearby school marked closed, and a child walking a longer path to a farther school, 1.2 miles on average."
    svg_homes: New homes
    svg_closed: CLOSED
    svg_school: Neighborhood school
    svg_far: Farther school
    svg_walk: average walk, today vs. proposed
