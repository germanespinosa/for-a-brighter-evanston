name: Help document freshness
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-help:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check help source, PDF and functionality fingerprints
        run: python3 scripts/build_help_pdf.py --check
