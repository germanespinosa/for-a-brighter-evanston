{%- assign s = include.t -%}
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 320" role="img" aria-label="{{ s.svg_label | escape }}" font-family="Public Sans, Arial, sans-serif">
  <rect width="600" height="320" fill="#EEF1F6"/>
  <!-- ground -->
  <rect x="0" y="238" width="600" height="82" fill="#DCE3EE"/>
  <rect x="0" y="236" width="600" height="4" fill="#C9D2E3"/>
  <!-- path from homes to far school -->
  <path d="M120 262 C 230 262, 250 282, 360 282 S 500 266, 540 262" fill="none" stroke="#C9D2E3" stroke-width="16" stroke-linecap="round"/>
  <path d="M120 262 C 230 262, 250 282, 360 282 S 500 266, 540 262" fill="none" stroke="#E8731A" stroke-width="4" stroke-dasharray="10 9" stroke-linecap="round"/>
  <!-- new homes: apartment building under construction -->
  <g>
    <rect x="52" y="92" width="118" height="146" fill="#13224F"/>
    <rect x="44" y="84" width="134" height="12" fill="#36558A"/>
    <g fill="#D9B96E">
      <rect x="66" y="108" width="16" height="16"/><rect x="92" y="108" width="16" height="16"/><rect x="118" y="108" width="16" height="16"/><rect x="144" y="108" width="16" height="16" opacity=".35"/>
      <rect x="66" y="136" width="16" height="16" opacity=".35"/><rect x="92" y="136" width="16" height="16"/><rect x="118" y="136" width="16" height="16"/><rect x="144" y="136" width="16" height="16"/>
      <rect x="66" y="164" width="16" height="16"/><rect x="92" y="164" width="16" height="16" opacity=".35"/><rect x="118" y="164" width="16" height="16"/><rect x="144" y="164" width="16" height="16"/>
    </g>
    <rect x="98" y="196" width="26" height="42" fill="#D9B96E"/>
    <path d="M36 84 V18 H150" fill="none" stroke="#36558A" stroke-width="4"/>
    <path d="M36 30 L60 18" stroke="#36558A" stroke-width="3"/>
    <line x1="132" y1="18" x2="132" y2="52" stroke="#36558A" stroke-width="2"/>
    <rect x="124" y="52" width="16" height="10" fill="#E8731A"/>
    <text x="111" y="306" text-anchor="middle" font-size="15" font-weight="800" fill="#13224F">{{ s.svg_homes }}</text>
  </g>
  <!-- neighborhood school: closed -->
  <g>
    <rect x="246" y="158" width="92" height="80" fill="#9AA8C2"/>
    <path d="M238 160 L292 128 L346 160 Z" fill="#7F8EAB"/>
    <rect x="286" y="104" width="2" height="26" fill="#7F8EAB"/><path d="M288 104 h16 v9 h-16z" fill="#7F8EAB"/>
    <g fill="#C9D2E3"><rect x="258" y="174" width="14" height="14"/><rect x="312" y="174" width="14" height="14"/><rect x="258" y="202" width="14" height="14"/><rect x="312" y="202" width="14" height="14"/></g>
    <rect x="282" y="206" width="20" height="32" fill="#7F8EAB"/>
    <g transform="rotate(-8 292 186)"><rect x="238" y="172" width="108" height="30" fill="#13224F"/><text x="292" y="193" text-anchor="middle" font-size="15" font-weight="900" letter-spacing="2" fill="#D9B96E">{{ s.svg_closed }}</text></g>
    <text x="292" y="306" text-anchor="middle" font-size="15" font-weight="800" fill="#6B7A98">{{ s.svg_school }}</text>
  </g>
  <!-- child walking -->
  <g transform="translate(418 236)">
    <circle cx="0" cy="-30" r="7" fill="#13224F"/>
    <path d="M-1 -22 L-2 -4" stroke="#13224F" stroke-width="5" stroke-linecap="round"/>
    <rect x="-11" y="-21" width="9" height="13" rx="2" fill="#E8731A"/>
    <path d="M-2 -4 L-8 10 M-2 -4 L5 10" stroke="#13224F" stroke-width="4" stroke-linecap="round"/>
    <path d="M-1 -18 L7 -9" stroke="#13224F" stroke-width="4" stroke-linecap="round"/>
  </g>
  <!-- farther school -->
  <g>
    <rect x="490" y="168" width="84" height="70" fill="#36558A"/>
    <path d="M482 170 L532 142 L582 170 Z" fill="#13224F"/>
    <rect x="530" y="118" width="2" height="26" fill="#13224F"/><path d="M532 118 h16 v9 h-16z" fill="#E8731A"/>
    <g fill="#D9B96E"><rect x="500" y="182" width="13" height="13"/><rect x="551" y="182" width="13" height="13"/><rect x="500" y="208" width="13" height="13"/><rect x="551" y="208" width="13" height="13"/></g>
    <rect x="522" y="210" width="20" height="28" fill="#13224F"/>
    <text x="532" y="306" text-anchor="middle" font-size="15" font-weight="800" fill="#C4560E">{{ s.svg_far }}</text>
  </g>
  <!-- distance callout -->
  <g transform="translate(416 70)">
    <rect x="-90" y="-26" width="180" height="50" rx="4" fill="#fff" stroke="#E8731A" stroke-width="2"/>
    <text x="0" y="6" text-anchor="middle" font-family="Archivo, Arial Black, sans-serif" font-size="24" font-weight="900" fill="#13224F">0.7 <tspan fill="#E8731A">→</tspan> 1.2 mi</text>
    <text x="0" y="40" text-anchor="middle" font-size="12" font-weight="700" fill="#36558A">{{ s.svg_walk }}</text>
  </g>
</svg>
