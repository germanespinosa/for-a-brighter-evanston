{%- assign t = site.data.i18n[page.lang] -%}
<footer class="site-footer">
  <div class="site-footer__inner">
    <div class="site-footer__main">
      <p class="site-footer__brand"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true" focusable="false"><path d="M12 2.5l2.9 6.1 6.6.8-4.9 4.6 1.3 6.5L12 17.3l-5.9 3.2 1.3-6.5L2.5 9.4l6.6-.8z" fill="currentColor"/></svg><span>For a Brighter Evanston</span></p>
      <p class="site-footer__tag">#ForABrighterEvanston</p>
    </div>
    <ul class="site-footer__links">
      <li>{{ t.footer.contact }}: <a href="mailto:{{ site.links.email }}">{{ site.links.email }}</a></li>
      <li><a href="{{ site.links.instagram }}" target="_blank" rel="noopener">Instagram @forabrighterevanston</a></li>
      <li>{{ t.footer.disclaimer }}</li>
    </ul>
  </div>
</footer>
