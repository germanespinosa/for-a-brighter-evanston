{%- assign ev = site.data.event -%}
{%- if ev.show -%}
{%- assign evl = ev[page.lang] -%}
<aside class="alert-bar" aria-label="{{ evl.eyebrow }}">
  <div class="alert-bar__inner">
    <p class="alert-bar__text">
      <span class="alert-bar__long">{{ evl.bar_long }}</span>
      <span class="alert-bar__short" aria-hidden="true">{{ evl.bar_short }}</span>
    </p>
  </div>
</aside>
{%- endif -%}
