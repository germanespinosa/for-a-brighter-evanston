<!doctype html>
<html lang="{{ page.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title }}</title>
  <meta name="robots" content="noindex">
  <link rel="canonical" href="{{ site.data.pledge.en.page_url | absolute_url }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@800;900&family=Public+Sans:wght@400;600;700&display=swap">
  <link rel="stylesheet" href="{{ '/assets/css/pledge.css' | relative_url }}">
</head>
<body class="pl-embed-body">
  {{ content }}
  <script src="{{ '/assets/js/pledge.js' | relative_url }}" defer></script>
</body>
</html>
